name: Build GifEditor.exe

# Nuitka cannot cross-compile, so the Windows executable is built on a Windows runner.
# Trigger it by hand (Actions -> Build GifEditor.exe -> Run workflow) or on a version tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r packaging/build-requirements.txt

      - name: Lint and test
        env:
          # Qt's default offscreen screen is 800x600, smaller than the test windows (mouse events
          # past x=800 never arrive). Same 3840x2160 virtual screen as scripts/test.sh. The path
          # must be relative: Qt splits this value on ':', which would cut a "D:\..." path.
          QT_QPA_PLATFORM: "offscreen:configfile=scripts/offscreen-screen.json"
        run: |
          ruff format --check .
          ruff check .
          python -m pytest -q

      - name: Check the committed icons match scripts/make_icon.py (pixels, not bytes)
        run: python scripts/make_icon.py --check

      - name: Check every Nuitka flag against Nuitka's own option table
        run: python scripts/check_build_flags.py

      - name: Build the single-file executable
        id: build
        run: python scripts/build.py

      - name: Smoke-test the built executable
        run: python scripts/smoke_build.py out/dist/GifEditor.exe

      # Uploaded even if the smoke test fails: the offscreen smoke run is not the same as a
      # real desktop, so a failing build is still worth trying by hand.
      - name: Upload the executable
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: GifEditor-windows
          path: out/dist/GifEditor.exe
          if-no-files-found: error
          retention-days: 30
